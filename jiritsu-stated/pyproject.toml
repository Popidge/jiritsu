[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jiritsu-stated"
version = "0.1.0"
description = "Stable, source-aware facts about an Omarchy machine"
requires-python = ">=3.11"
license = { text = "MIT" }

[project.scripts]
jiritsu-stated = "jiritsu_stated.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
