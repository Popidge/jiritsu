[package]
name = "jiritsu-stated"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "A read-only machine-state daemon for Omarchy"
license = "MIT"

[lib]
name = "jiritsu_stated_rs"
path = "rust/src/lib.rs"

[[bin]]
name = "jiritsu-stated"
path = "rust/src/main.rs"

[[test]]
name = "contract"
path = "rust/tests/contract.rs"

[[test]]
name = "daemon"
path = "rust/tests/daemon.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
