schema_version = "1.0"
id = "agent-development"
title = "Agent development"
description = "The machine has the core tools for local agent-assisted software development."

[[capabilities]]
id = "agent-runtime"
title = "Agent runtime"
description = "The Codex command is installed and responds."
importance = "critical"

[[capabilities.checks]]
id = "codex-version"
type = "command"
description = "Read the installed Codex command version."
command = ["codex", "--version"]
expected_exit = 0
stdout = "nonempty"
timeout_seconds = 5

[[capabilities]]
id = "version-control"
title = "Version control"
description = "The native Git package is installed."
importance = "critical"

[[capabilities.checks]]
id = "git-version"
type = "stated_fact"
description = "Find the installed Git package."
fact = "packages.installed"
path = "packages.*.name"
operator = "contains"
expected = "git"
fallback = { type = "command", command = ["git", "--version"], expected_exit = 0, stdout = "nonempty", timeout_seconds = 5 }

[[capabilities]]
id = "source-search"
title = "Source search"
description = "The native ripgrep package is installed."
importance = "useful"

[[capabilities.checks]]
id = "ripgrep-version"
type = "stated_fact"
description = "Find the installed ripgrep package."
fact = "packages.installed"
path = "packages.*.name"
operator = "contains"
expected = "ripgrep"
fallback = { type = "command", command = ["rg", "--version"], expected_exit = 0, stdout = "nonempty", timeout_seconds = 5 }

[[capabilities]]
id = "python-runtime"
title = "Python runtime"
description = "The native Python package is installed."
importance = "useful"

[[capabilities.checks]]
id = "python-version"
type = "stated_fact"
description = "Find the installed Python package."
fact = "packages.installed"
path = "packages.*.name"
operator = "contains"
expected = "python"
fallback = { type = "command", command = ["python3", "--version"], expected_exit = 0, stdout = "nonempty", timeout_seconds = 5 }
